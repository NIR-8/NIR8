<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NIR8 Admin</title>
<style>
:root { --g:#157347; --g2:#e8f5e9; --ink:#1a1a1a; --mut:#6b7480; --line:#e3e7ee; --bg:#f4f6f8; --warn:#b86e00; --bad:#c62828; }
* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin:0; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45; }
[hidden] { display:none !important; }
button, input, select { font: inherit; }
button { cursor:pointer; }
input[type=text], input[type=password], input[type=number], select { width:100%; padding:9px 10px; border:1px solid #cfd6df; border-radius:8px; background:#fff; color:var(--ink); }
input:focus, select:focus, button:focus-visible { outline:2px solid var(--g); outline-offset:1px; }
.muted { color:var(--mut); } .small { font-size:12px; } .mt { margin-top:12px; } .sp { flex:1; }

/* login */
#loginView { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.login { width:100%; max-width:380px; background:#fff; border-radius:16px; padding:26px; box-shadow:0 10px 40px rgba(20,40,60,.12); }
.login h1 { margin:0 0 4px; font-size:22px; } .login p { margin:0 0 16px; color:var(--mut); }
.login label, .field { display:block; margin-top:12px; font-weight:600; font-size:12px; color:#394150; }
.login input, .field input { margin-top:4px; font-weight:400; }
.err, .msg.bad { color:var(--bad); font-size:13px; min-height:18px; margin-top:10px; } .msg.ok { color:#137333; font-size:13px; margin-top:10px; }
.login details { margin-top:16px; font-size:12px; color:var(--mut); } .login summary { cursor:pointer; font-weight:600; }
.login ol { padding-left:18px; } .login code, .code { background:#f1f3f4; padding:1px 5px; border-radius:4px; font-size:12px; word-break:break-all; }
.btn { border:1px solid var(--line); background:#fff; color:var(--ink); padding:8px 14px; border-radius:8px; font-weight:600; }
.btn:hover { background:#f2f6f3; } .btn:disabled { opacity:.45; cursor:not-allowed; }
.btn.primary { background:var(--g); border-color:var(--g); color:#fff; } .btn.primary:hover { background:#106038; }
.btn.danger { color:var(--bad); } .btn.ghost { background:transparent; } .btn.tiny { padding:3px 9px; font-size:12px; }
.btn.block { width:100%; margin-top:16px; padding:11px; }
.filebtn { display:inline-block; }

/* app shell */
.topbar { position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 16px; background:#fff; border-bottom:1px solid var(--line); }
.topbar h1 { font-size:16px; margin:0 8px 0 0; }
.chip { padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; } .chip.ok { background:#e6f4ea; color:#137333; } .chip.warn { background:#fff3dd; color:var(--warn); }
.banner { background:#fff3dd; color:#7a4300; padding:10px 16px; font-size:13px; border-bottom:1px solid #f1d9a8; }
.tabs { display:flex; gap:4px; padding:10px 16px 0; overflow-x:auto; }
.tab { border:none; background:transparent; padding:9px 14px; border-radius:10px 10px 0 0; font-weight:600; color:var(--mut); white-space:nowrap; }
.tab.on { background:#fff; color:var(--g); box-shadow:0 -1px 0 var(--line) inset; }
main { padding:0 16px 40px; max-width:1180px; margin:0 auto; }
.tabs, .topbar { max-width:none; }
#tabBody { background:#fff; border-radius:0 12px 12px 12px; padding:16px; }
.card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
.card.empty { text-align:center; padding:28px; }
.cardhead { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.row { display:flex; align-items:center; } .row.gap { gap:8px; } .row.wrap { flex-wrap:wrap; }
.split { display:grid; grid-template-columns:270px minmax(0,1fr); gap:14px; align-items:start; } .split > * { min-width:0; }
@media (max-width:820px) { .split { grid-template-columns:minmax(0,1fr); } }
@media (max-width:600px) { .topbar { padding:6px 10px; gap:6px; } .topbar h1 { display:none; } .topbar .btn { padding:6px 10px; font-size:13px; } .lbl, #signOutBtn { display:none; } main { padding:0 8px 40px; } .tabs { padding:8px 8px 0; } #tabBody { padding:12px; } }

/* products */
.plist { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
.pitem { display:flex; align-items:center; gap:8px; padding:9px 10px; border:1px solid var(--line); border-radius:9px; background:#fff; cursor:pointer; }
.pitem.on { border-color:var(--g); background:var(--g2); } .pitem.over { outline:2px dashed var(--g); } .pitem.manual { background:#fafafa; }
.grip { color:#9aa0a6; cursor:grab; user-select:none; } .pname { flex:1; font-weight:600; } .pmeta { color:var(--mut); font-size:12px; }
.stepper { display:inline-flex; align-items:center; border:1px solid #cfd6df; border-radius:8px; overflow:hidden; }
.sbtn { border:none; background:#f4f6f8; width:32px; height:32px; font-size:18px; } .sbtn:disabled { opacity:.4; }
.stepval { min-width:34px; text-align:center; font-weight:700; }
.tscroll { overflow-x:auto; } table.lots { border-collapse:collapse; width:100%; min-width:440px; }
.lots th, .lots td { padding:5px; text-align:center; } .lots th { font-size:12px; color:var(--mut); }
.lots td input { text-align:center; padding:7px 4px; } .rowlab { text-align:left !important; font-size:12px; font-weight:600; min-width:120px; } .tot { font-weight:700; }
.switch { display:flex; align-items:center; gap:10px; margin:8px 0; } .switch input { width:auto; accent-color:var(--g); transform:scale(1.2); }
.narrow { width:80px !important; }

/* formulas (typed as text) */
.testbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; padding:8px 10px; background:#f7f8fa; border-radius:8px; }
.testbar label { display:flex; align-items:center; gap:6px; font-weight:600; } .testbar input { width:90px; padding:6px 8px; }
.fb { border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; }
.fb-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; } .fb-head .btn { margin-left:auto; }
.fb-pretty { margin-top:10px; font-size:15px; font-weight:600; } .fb-status { margin-top:4px; font-size:12px; } .fb-status.ok { color:#137333; } .fb-status.bad { color:var(--bad); }
.fb-text { width:100%; margin-top:6px; font-family:ui-monospace, Menlo, Consolas, monospace; font-size:16px; }

.pickbtn { display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; padding:0; }
.pickbtn.on { background:#1a73e8; border-color:#1a73e8; color:#fff; }
.htmlsplit { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; margin-top:8px; align-items:start; }
.htmlsplit textarea, .htmlsplit iframe { width:100%; height:78vh; box-sizing:border-box; }
.htmlsplit iframe { border:1px solid #ccc; border-radius:8px; background:#fff; }
.htmlsplit textarea { font:12px/1.4 monospace; white-space:pre; tab-size:2; }
@media (max-width:900px) { .htmlsplit { grid-template-columns:minmax(0,1fr); } .htmlsplit textarea, .htmlsplit iframe { height:46vh; } }
/* layout editor */
.lay-canvas { padding:10px; border-radius:10px; background:repeating-linear-gradient(90deg,#f3f6f4 0,#f3f6f4 calc(100%/12 - 1px),#e4ebe6 calc(100%/12 - 1px),#e4ebe6 calc(100%/12)); }
.lay-row { display:flex; gap:12px; align-items:flex-start; justify-content:center; }
.lay-strip { height:10px; margin:2px 0; border-radius:5px; transition:height .1s; } .lay-strip.over { height:28px; background:#c8e6c9; }
.lay-block { position:relative; background:#fff; border:2px solid #b9c7be; border-radius:10px; padding:10px 14px 10px 10px; overflow:hidden; cursor:grab; min-width:0; }
.lay-block.sel { border-color:var(--g); box-shadow:0 0 0 3px rgba(21,115,71,.18); }
.lay-block.drop-before { box-shadow:inset 6px 0 0 var(--g); } .lay-block.drop-after { box-shadow:inset -6px 0 0 var(--g); }
.lb-title { font-weight:700; } .lb-tab { font-size:11px; color:var(--g); font-weight:600; } .lb-meta { font-size:11px; color:var(--mut); margin-top:6px; }
.lb-hr { position:absolute; top:0; right:0; bottom:0; width:12px; cursor:ew-resize; background:rgba(21,115,71,.22); touch-action:none; }
.lb-hb { position:absolute; left:0; right:12px; bottom:0; height:10px; cursor:ns-resize; background:rgba(21,115,71,.14); touch-action:none; }
.lay-panel { margin-top:12px; padding:10px 12px; background:#f7f8fa; border-radius:10px; }
.hist .hrow { display:flex; gap:12px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); } .hist .hrow .btn { margin-left:auto; }
.hent { border-bottom:1px solid var(--line); padding:8px 0; }
.hent summary { display:flex; gap:10px; align-items:center; cursor:pointer; flex-wrap:wrap; }
.hent summary .btn { margin-left:auto; }
.hchg { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:7px 4px 7px 18px; border-top:1px dashed var(--line); }
.hchg .lab { font-weight:600; } .hchg .vals { flex:1; min-width:160px; color:var(--mut); font-size:12px; word-break:break-word; }
.hchg .btn { margin-left:auto; } .chip.done { background:#eef0f3; color:#394150; }

/* modal + toast */
.modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:60; padding:16px; }
.modal-card { background:#fff; border-radius:14px; padding:20px; max-width:440px; width:100%; } .modal-card ul { padding-left:18px; color:var(--bad); }
.toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#1f2933; color:#fff; padding:10px 16px; border-radius:10px; opacity:0; pointer-events:none; z-index:80; max-width:92vw; }
.toast.show { opacity:1; } .toast.ok { background:#137333; } .toast.bad { background:var(--bad); }

</style>
</head>
<body>
<div id="loginView">
  <div class="login">
    <h1>NIR8 Admin</h1>
    <p>Sign in to change products, formulas, lots and the page layout.</p>
    <label for="loginId">User ID</label>
    <input id="loginId" type="text" value="Admin" autocomplete="username" spellcheck="false">
    <label for="loginPw">Password</label>
    <input id="loginPw" type="password" autocomplete="current-password">
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn primary block" id="loginBtn" type="button">Sign in</button>
  </div>
</div>

<div id="appView" hidden>
  <div class="topbar">
    <h1>NIR8 Admin</h1>
    <span id="saveChip" class="chip ok">All changes published</span>
    <span class="sp"></span>
    <button class="btn ghost" id="undoBtn" type="button" title="Undo (Ctrl+Z)" aria-label="Undo">↶<span class="lbl"> Undo</span></button>
    <button class="btn ghost" id="redoBtn" type="button" title="Redo (Ctrl+Y)" aria-label="Redo">↷<span class="lbl"> Redo</span></button>
    <button class="btn" id="previewBtn" type="button">Preview</button>
    <button class="btn primary" id="publishBtn" type="button">Publish</button>
    <button class="btn ghost" id="signOutBtn" type="button">Sign out</button>
  </div>
  <div class="banner" id="banner" hidden>You are signed in with the default password. Change it in the <b>Account</b> tab.</div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <main><div id="tabBody"></div></main>
  <div class="modal" id="problems" hidden></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* NIR8 admin — core logic (pure, testable): formulas, layout engine, config */
(function (root) {
  'use strict';
  const COLS = 12, MINW = 3, MAXLOTS = 12;
  const BLOCKS = {
    spec:  { label: 'Formula card',        hint: 'F1 / F2 / F3 shown above the inputs', w: 10, h: 90,  tab: 'Formula tab' },
    input: { label: 'Input card',          hint: 'Quantity, Water, Assay and Calculate buttons', w: 5, h: 190, tab: 'Formula tab' },
    steps: { label: 'Calculation sheets',  hint: 'The printable calculation cards', w: 10, h: 230, tab: 'Formula tab' },
    acb:   { label: '(A+C)-B table',       hint: 'Lot table and hold-time card', w: 6, h: 240, tab: '(A+C)-B tab' }
  };
  const BLOCK_IDS = Object.keys(BLOCKS);
  const STD = { F1: 'Q*100*100/(A*(100-W))', F2: 'Q*A*(100-W)/(100*100)', F3: 'Q*100*100/(A*(100-W))' };

  const DEFAULT_CONFIG = {
    v: 1,
    manual: { enabled: true, lots: 4 },
    products: [
      { id: 'valacyclovir',  name: 'Valacyclovir',  formulas: { ...STD }, moisture: 'water', a: [417, 417, 417, 417],             c: [84.375, 84.375, 84.375, 84.375] },
      { id: 'levetiracetam', name: 'Levetiracetam', formulas: { ...STD }, moisture: 'water', a: [268.75, 268.75, 268.75, 268.75], c: [14.674, 14.674, 14.674, 14.673] }
    ],
    layout: null,
    styles: {},
    src: null,
    fixed: { footer: true, tag: true, tagSide: 'right' },
    ui: {
      pageTitle: 'NIR8 Calculators',
      footerText: 'Always double-check results.',
      helpBtnText: 'ℹ️ Help & Shortcuts',
      tabFormula: 'Formula',
      tabAcb: '(A+C)-B',
      productGateTitle: 'Select product',
      showHoldPeriod: true,
      holdTitle: 'Hold time period',
      qMax: 9999999,
      waterMax: 99.99,
      assayMax: 100,
      gateSearch: true,
      gateWidth: 380,
      gateMaxH: 80,
      gateRow: 'normal',
      menuWidth: 0,
      selSize: 'normal'
    }
  };

  const clone = (o) => JSON.parse(JSON.stringify(o));
  const clampInt = (v, lo, hi, d) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d; };

  /* ───────────── Formula tokens ───────────── */
  // token: {t:'var',v:'Q'} {t:'num',v:'100'} {t:'op',v:'*'} {t:'lp'} {t:'rp'}
  function tokenize(str) {
    const s = String(str || '').replace(/\s+/g, '');
    const re = /([QWA])|(\d+(?:\.\d+)?)|([+\-*\/])|(\()|(\))/y;
    const out = []; let pos = 0;
    while (pos < s.length) {
      re.lastIndex = pos; const m = re.exec(s);
      if (!m) return null;
      if (m[1]) out.push({ t: 'var', v: m[1] });
      else if (m[2]) out.push({ t: 'num', v: m[2] });
      else if (m[3]) out.push({ t: 'op', v: m[3] });
      else if (m[4]) out.push({ t: 'lp' });
      else out.push({ t: 'rp' });
      pos = re.lastIndex;
    }
    return out;
  }
  const tokText = (k) => (k.t === 'lp' ? '(' : k.t === 'rp' ? ')' : k.v);
  const toExpr = (toks) => toks.map(tokText).join('');
  const SHOW = { '*': '×', '/': '÷', '-': '−', '+': '+' };
  const toPretty = (toks) => toks.map((k) => (k.t === 'op' ? ' ' + SHOW[k.v] + ' ' : tokText(k))).join('').trim();

  // recursive-descent evaluator (same grammar the website accepts)
  function evaluate(expr, vals) {
    const s = String(expr || '').replace(/\s+/g, ''); let i = 0;
    const fail = (m) => { throw new Error(m); };
    function num() {
      const m = /^\d+(?:\.\d+)?/.exec(s.slice(i)); if (!m) fail('Number expected'); i += m[0].length; return parseFloat(m[0]);
    }
    function factor() {
      const c = s[i];
      if (c === '-') { i++; return -factor(); }
      if (c === '(') { i++; const v = sum(); if (s[i] !== ')') fail('Missing )'); i++; return v; }
      if (c === 'Q' || c === 'W' || c === 'A') { i++; return Number(vals[c]); }
      if (c !== undefined && /\d/.test(c)) return num();
      return fail(c === undefined ? 'Formula ends too early' : 'Unexpected "' + c + '"');
    }
    function term() { let v = factor(); while (s[i] === '*' || s[i] === '/') { const o = s[i++]; const r = factor(); v = o === '*' ? v * r : v / r; } return v; }
    function sum() { let v = term(); while (s[i] === '+' || s[i] === '-') { const o = s[i++]; const r = term(); v = o === '+' ? v + r : v - r; } return v; }
    if (!s) fail('Formula is empty');
    const v = sum(); if (i < s.length) fail('Unexpected "' + s[i] + '"');
    return v;
  }
  // returns {ok, error, value}
  function checkFormula(expr, vals) {
    try {
      if (!tokenize(expr)) return { ok: false, error: 'Only Q, W, A, numbers, + − × ÷ and brackets are allowed' };
      const v = evaluate(expr, vals || { Q: 100, W: 5, A: 99 });
      if (!/Q/.test(expr)) return { ok: false, error: 'The formula must use Q (quantity)' };
      if (!Number.isFinite(v)) return { ok: false, error: 'Gives no valid number (division by zero?)' };
      return { ok: true, value: v };
    } catch (e) { return { ok: false, error: e.message }; }
  }

  /* ───────────── Layout engine: rows of blocks that reflow, never overlap ───────────── */
  const rowSum = (row) => row.reduce((t, it) => t + it.w, 0);
  function locate(rows, id) { for (let r = 0; r < rows.length; r++) { const i = rows[r].findIndex((it) => it.id === id); if (i >= 0) return { r, i }; } return null; }
  function defaultRows() { return BLOCK_IDS.map((id) => [{ id, w: BLOCKS[id].w, h: 0 }]); }
  function tidy(rows) { return rows.filter((r) => r.length); }

  // make row r fit in 12 columns, keeping `keepId` as large as possible
  function fitRow(rows, r, keepId) {
    let guard = 0;
    while (rowSum(rows[r]) > COLS && guard++ < 50) {
      const row = rows[r], over = rowSum(row) - COLS;
      const k = row.findIndex((it) => it.id === keepId);
      const order = [];                                   // neighbours: right side nearest-first, then left side nearest-first
      for (let j = k + 1; j < row.length; j++) order.push(j);
      for (let j = k - 1; j >= 0; j--) order.push(j);
      const room = order.reduce((t, j) => t + Math.max(0, row[j].w - MINW), 0);
      if (over <= room) {
        let left = over;
        for (const j of order) { const cut = Math.min(left, row[j].w - MINW); if (cut > 0) { row[j].w -= cut; left -= cut; } if (left <= 0) break; }
      } else {
        // not enough room: wrap the right-most other block to a new row below and try again
        const idx = order.length ? (k < row.length - 1 ? row.length - 1 : 0) : -1;
        if (idx < 0 || row.length < 2) { row[0].w = COLS; break; }
        const [moved] = row.splice(idx, 1);
        rows.splice(r + 1, 0, [moved]);
      }
    }
    return rows;
  }

  function resizeBlock(rows0, id, w) {
    const rows = clone(rows0), at = locate(rows, id); if (!at) return rows;
    rows[at.r][at.i].w = clampInt(w, MINW, COLS, rows[at.r][at.i].w);
    fitRow(rows, at.r, id);
    return tidy(rows);
  }
  function setBlockHeight(rows0, id, h) {
    const rows = clone(rows0), at = locate(rows, id); if (at) rows[at.r][at.i].h = clampInt(h, 0, 2000, 0);
    return rows;
  }
  // target: {type:'before'|'after', id}  or  {type:'row', at:index}
  function moveBlock(rows0, id, target) {
    const rows = clone(rows0), from = locate(rows, id); if (!from) return rows;
    if (target.type !== 'row' && target.id === id) return rows0;
    const [item] = rows[from.r].splice(from.i, 1);
    if (!rows[from.r].length) { rows.splice(from.r, 1); if (target.type === 'row' && target.at > from.r) target.at--; }
    if (target.type === 'row') {
      rows.splice(Math.max(0, Math.min(rows.length, target.at)), 0, [item]);
    } else {
      const at = locate(rows, target.id);
      if (!at) rows.push([item]);
      else {
        const row = rows[at.r];
        row.splice(target.type === 'after' ? at.i + 1 : at.i, 0, item);
        // a dropped block first takes the space that is left in the row; only if that is not enough do its neighbours give way
        const others = row.filter((it) => it.id !== id).reduce((t, it) => t + it.w, 0);
        if (rowSum(row) > COLS) item.w = Math.max(MINW, Math.min(item.w, COLS - others));
        fitRow(rows, at.r, id);
      }
    }
    return tidy(rows);
  }
  function sanitizeStyles(raw) {
    const out = {};
    if (!raw || typeof raw !== 'object') return out;
    const n = (x, lo, hi) => { x = Number(x); return isFinite(x) ? Math.round(Math.min(hi, Math.max(lo, x))) : 0; };
    const col = (x) => (/^#[0-9a-f]{6}$/i.test(x) ? x : '');
    Object.keys(raw).slice(0, 400).forEach((k) => {
      const v = raw[k];
      if (k.length > 300 || !/^[\w#\-.\s>:()+\[\]="',*~\\]+$/.test(k) || !v || typeof v !== 'object') return;
      const s = { x: n(v.x, -3000, 3000), y: n(v.y, -3000, 3000), w: n(v.w, 0, 3000), h: n(v.h, 0, 3000), fs: n(v.fs, 0, 120), c: col(v.c), bg: col(v.bg), hide: v.hide ? 1 : 0 };
      if (typeof v.t === 'string') s.t = v.t.slice(0, 300);
      if (s.x || s.y || s.w || s.h || s.fs || s.c || s.bg || s.hide || s.t !== undefined) out[k] = s;
    });
    return out;
  }
  function sanitizeLayout(l) {
    const seen = new Set(), rows = [];
    (l && Array.isArray(l.rows) ? l.rows : []).forEach((r) => {
      if (!Array.isArray(r)) return; let row = [], sum = 0;
      r.forEach((it) => {
        const id = it && it.id; if (!BLOCKS[id] || seen.has(id)) return; seen.add(id);
        const w = clampInt(it.w, MINW, COLS, BLOCKS[id].w), h = clampInt(it.h, 0, 2000, 0);
        if (sum + w > COLS) { if (row.length) rows.push(row); row = []; sum = 0; }

  function endApp() { clearTimeout(idleTimer); $('appView').hidden = true; $('loginView').hidden = false; $('loginPw').value = ''; S.cfg = null; }

  async function doLogin() {

/* NIR8 admin — Firebase backend (same project + SDK as VAULT) */
// Firebase is loaded safely: if the SDK is blocked/offline the page still works and shows a clear message
let db = null, doc, getDoc, setDoc, loadError = null;
try {
  const appMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const fsMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
  ({ doc, getDoc, setDoc } = fsMod);
  const app = appMod.initializeApp({
    apiKey:            'AIzaSyAF1nxXeZhz7LvWpQFTnFYNifuZII_R-mE',
    authDomain:        'onekey-5067d.firebaseapp.com',
    projectId:         'onekey-5067d',
    storageBucket:     'onekey-5067d.firebasestorage.app',
    messagingSenderId: '1098836590874',
    appId:             '1:1098836590874:web:9c62490ce2670a4418aca3'
  });
  // long-polling auto-detect avoids hangs on networks/proxies that break WebChannel streaming
  db = fsMod.initializeFirestore(app, { experimentalAutoDetectLongPolling: true });

function friendly(e) {
  const code = e && e.code, msg = (e && e.message) || '';
  if (code === 'permission-denied' || /insufficient permissions/i.test(msg))
    return 'Firestore is refusing access. Add the config read/write rule in Firebase → Firestore → Rules and publish it, then try again.';
  if (code === 'unavailable' || /timeout|offline/i.test(msg))
    return 'Cannot reach the server. Check your internet connection and try again.';
  return msg || 'Something went wrong.';
}

const ADMIN_ID = 'admin';
const DEFAULT_SALT = 'nir8-default';
const DEFAULT_HASH = 'a8b7d3103753fff46c64388997864c55e015ca6f44a159ab60a880ce31d3b786'; // PBKDF2 of Caps@1234
const ITER = 150000;
const enc = new TextEncoder();
const hex = (buf) => Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');

async function hashPw(pw, salt) {
  if (!window.crypto || !crypto.subtle) throw new Error('This page must be opened over https:// (or localhost) for sign-in to work.');
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  return hex(await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: enc.encode(salt), iterations: ITER, hash: 'SHA-256' },
    base, 256
  ));
}

function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, rej) => setTimeout(() => rej(new Error('Network timeout — check your connection (' + label + ')')), ms))
  ]);
}

async function fsGet(name) {
  if (!db) throw new Error('Could not load Firebase (' + ((loadError && loadError.message) || 'blocked or offline') + '). Check your connection / ad-blocker and reload.');
  const s = await withTimeout(getDoc(doc(db, 'config', name)), 12000, name);
  return s.exists() ? s.data() : null;
}
async function fsSet(name, data) {
  if (!db) throw new Error('Could not load Firebase. Check your connection and reload.');
  await withTimeout(setDoc(doc(db, 'config', name), data), 12000, name);
}

let authCb = null, signedIn = false, fails = 0;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

async function credentials() {
  let d;
  try { d = await fsGet('admin'); } catch (e) { throw new Error(friendly(e)); }
  if (d && d.salt && d.hash) return { salt: d.salt, hash: d.hash };
  return { salt: DEFAULT_SALT, hash: DEFAULT_HASH };
}

window.NIR8Backend = {
  onAuth(cb) { authCb = cb; },
  userId: () => 'Admin',
  async signIn(id, pw) {
    if (fails >= 3) await wait(Math.min(8000, 1000 * (fails - 2)));
    const cred = await credentials();      // throws a readable message if the server can't be reached
    const ok = String(id).trim().toLowerCase() === ADMIN_ID && (await hashPw(pw, cred.salt)) === cred.hash;
    if (!ok) { fails++; throw new Error('Wrong User ID or password.'); }
    fails = 0; signedIn = true; if (authCb) authCb({ id: 'Admin' });
  },
  signOut() { signedIn = false; if (authCb) authCb(null); },
  async loadConfig() {
    const d = await fsGet('app');
    return d && d.json ? d.json : null;
  },
  // every publish is a restore point: the state before it + the list of individual changes (each can be reverted on its own)
  async saveConfig(text, makeChanges) {
    if (!signedIn) throw new Error('Please sign in again.');
    const prev = await fsGet('app');
    const prevJson = prev && prev.json ? prev.json : null;
    let changes = [];
    try { changes = makeChanges ? makeChanges(prevJson) : []; } catch {}
    if (changes.length || (prevJson && !makeChanges)) {
      let items = [];
      try {
        const h = await fsGet('history');
        items = (h && h.items) ? (typeof h.items === 'string' ? JSON.parse(h.items) : h.items) : [];
      } catch {}
      items.unshift({ ts: Date.now(), json: prevJson, changes });
      items = items.slice(0, 40);
      while (items.length > 1 && JSON.stringify(items).length > 500000) items.pop();   // stay well under Firestore's 1 MB document limit
      // stored as one string: change lists contain nested arrays, which Firestore does not allow
      try { await fsSet('history', { items: JSON.stringify(items) }); } catch (e) { throw new Error(friendly(e)); }
    }
    try { await fsSet('app', { json: text, updatedAt: Date.now() }); } catch (e) { throw new Error(friendly(e)); }
  },
  async loadHistory() {
    try {
      const h = await fsGet('history');
      if (!h || !h.items) return [];
      return typeof h.items === 'string' ? JSON.parse(h.items) : h.items;
    } catch { return []; }
  },
  async changePassword(cur, next) {
    const c = await credentials();
    if ((await hashPw(cur, c.salt)) !== c.hash) throw new Error('The current password is wrong.');
    const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
    await fsSet('admin', { salt, hash: await hashPw(next, salt) });
  }
};

window.NIR8UI.init();
</script>
